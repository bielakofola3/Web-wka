{% extends "base.html" %}
{% block title %}Rejestracja{% endblock %}
{% block content %}
    <h2>Rejestracja</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="hidden" name="csrftoken" value="{{ request.state.csrftoken }}">
        <label>Nazwa użytkownika<br><input type="text" name="username" required minlength="3" maxlength="50"></label>
        <label>Email<br><input type="email" name="email" required></label>
        <label>Hasło (min. 8 znaków)<br><input type="password" name="password" required minlength="8"></label>
        <button type="submit">Zarejestruj</button>
    </form>
{% endblock %}
